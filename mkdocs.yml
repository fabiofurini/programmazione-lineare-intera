# mkdocs.yml template (English): generated by genera_sito.py with LINGUA=en.
# Do not edit mkdocs.yml by hand.
site_name: Programmazione lineare intera · Fabio Furini
site_url: https://fabiofurini.github.io/programmazione-lineare-intera/
site_description: >-
  Le dispense di programmazione lineare intera: modelli e bound, formulazioni ideali e disuguaglianze valide, piani di taglio, branch-and-bound e branch-and-cut, solver ed euristiche MIP, con esempi svolti ed esercizi con la soluzione.
site_author: Fabio Furini
repo_url: https://github.com/fabiofurini/programmazione-lineare-intera
copyright: >-
  &copy; 2026 Fabio Furini — text and figures licensed under
  <a href="https://creativecommons.org/licenses/by/4.0/deed.en">CC BY 4.0</a>,
  code licensed under
  <a href="https://github.com/fabiofurini/programmazione-lineare-intera/blob/main/LICENSE-CODE">MIT</a>

theme:
  name: material
  language: it
  icon:
    logo: material/dots-grid
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

# le pagine delle singole app non stanno nel menu: il laboratorio è una voce sola
plugins:
  - search:
      lang: en

extra:
  social:
    - icon: material/web
      link: https://fabiofurini.github.io/
      name: Fabio Furini — sito personale
    - icon: material/school
      link: https://www.diag.uniroma1.it/
      name: DIAG — Sapienza Università di Roma
    - icon: fontawesome/brands/github
      link: https://github.com/fabiofurini
      name: GitHub
    - icon: material/chart-timeline-variant
      link: https://fabiofurini.github.io/laboratorio-ricerca-operativa/
      name: Laboratorio di Ricerca Operativa
    - icon: material/vector-triangle
      link: https://fabiofurini.github.io/programmazione-lineare/
      name: Programmazione lineare
    - icon: material/vector-polygon
      link: https://fabiofurini.github.io/modellazione-mip/
      name: Modellazione MIP
    - icon: material/math-integral
      link: https://fabiofurini.github.io/analisi-matematica-1/
      name: Analisi Matematica 1
    - icon: material/matrix
      link: https://fabiofurini.github.io/algebra-lineare/
      name: Algebra lineare
    - icon: material/chart-bell-curve
      link: https://fabiofurini.github.io/ottimizzazione-convessa/
      name: Ottimizzazione convessa
    - icon: material/code-braces
      link: https://fabiofurini.github.io/algoritmi/
      name: Algoritmi
  alternate:
    - name: English
      link: https://fabiofurini.github.io/integer-linear-programming/
      lang: en

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      title: On this page
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/cloudflare-analytics.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js


nav:
  - Home: index.md
