# Modello del sito italiano di Programmazione lineare intera.
site_name: Programmazione lineare intera · Fabio Furini
site_description: >-
  Corso di programmazione lineare intera: modelli, formulazioni, metodi esatti, solver ed euristiche MIP,
  con spiegazioni, esempi svolti, esercizi e laboratorio interattivo.
site_author: Fabio Furini
site_url: https://fabiofurini.github.io/programmazione-lineare-intera/
repo_url: https://github.com/fabiofurini/programmazione-lineare-intera
copyright: >-
  &copy; 2026 Fabio Furini — testi e figure con licenza
  <a href="https://creativecommons.org/licenses/by/4.0/deed.it">CC BY 4.0</a>,
  codice con licenza
  <a href="https://github.com/fabiofurini/programmazione-lineare-intera/blob/main/LICENSE-CODE">MIT</a>

theme:
  name: material
  language: it
  icon:
    logo: material/dots-grid
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Tema scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Tema chiaro
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

# le pagine delle singole app non stanno nel menu: il laboratorio è una voce sola
not_in_nav: |
  /lab/*.md
  !/lab/index.md

plugins:
  - search:
      lang: it

extra:
  social:
    - icon: material/web
      link: https://fabiofurini.github.io/
      name: Fabio Furini — sito personale
    - icon: material/school
      link: https://www.diag.uniroma1.it/
      name: DIAG — Sapienza Università di Roma
    - icon: fontawesome/brands/github
      link: https://github.com/fabiofurini
      name: GitHub
    - icon: material/chart-timeline-variant
      link: https://fabiofurini.github.io/laboratorio-ricerca-operativa/
      name: Laboratorio di Ricerca Operativa
    - icon: material/vector-triangle
      link: https://fabiofurini.github.io/programmazione-lineare/
      name: Programmazione lineare
    - icon: material/vector-polygon
      link: https://fabiofurini.github.io/modellazione-mip/
      name: Modellazione MIP
    - icon: material/math-integral
      link: https://fabiofurini.github.io/analisi-matematica-1/
      name: Analisi Matematica 1
    - icon: material/matrix
      link: https://fabiofurini.github.io/algebra-lineare/
      name: Algebra lineare
    - icon: material/chart-bell-curve
      link: https://fabiofurini.github.io/ottimizzazione-convessa/
      name: Ottimizzazione convessa
    - icon: material/code-braces
      link: https://fabiofurini.github.io/algoritmi/
      name: Algoritmi
  alternate:
    - name: English
      link: https://fabiofurini.github.io/integer-linear-programming/
      lang: en

extra_css:
  - stylesheets/extra.css?v=f70f7801ce
  - https://cdn.jsdelivr.net/npm/jsxgraph@1.10.1/distrib/jsxgraph.css
  - stylesheets/interattivi.css?v=5d53d6f224

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      title: In questa pagina
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/cloudflare-analytics.js?v=bff73345a1
  - javascripts/mathjax.js?v=bb7dec5d26
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js
  # grafici interattivi: JSXGraph, il motore, il catalogo dei problemi, poi le ricette (gi-*.js, le aggiunge genera_sito.py)
  - https://cdn.jsdelivr.net/npm/jsxgraph@1.10.1/distrib/jsxgraphcore.js
  - javascripts/interattivi.js?v=5452c77472
  - javascripts/gi-comune.js?v=40df75e3e5
  - javascripts/gi-pli-dati.js?v=8ebd23eab0
  - javascripts/gi-pli.js?v=c760264fa1

nav:
  - Home: index.md
  - Modelli e limiti:
      - models-and-bounds/index.md
      - "1. Programmazione lineare intera": models-and-bounds/ilp.md
      - "2. Bound primali e bound duali": models-and-bounds/lp-relaxation.md
  - Formulazioni:
      - formulations/index.md
      - "3. Formulazioni ideali": formulations/ideal-formulations.md
      - "4. Disuguaglianze valide": formulations/valid-inequalities.md
      - "5. Disuguaglianze di copertura": formulations/cover.md
  - Metodi esatti:
      - exact-methods/index.md
      - "6. Piani di taglio": exact-methods/gomory.md
      - "7. Branch-and-bound": exact-methods/bb.md
      - "8. Branch-and-cut": exact-methods/branch-and-cut.md
  - Solver MIP:
      - solvers/index.md
      - "9. Solver MIP": solvers/mip-solvers.md
  - Euristiche MIP:
      - mip-heuristics/index.md
      - "10. Euristiche MIP": mip-heuristics/mip-heuristics.md
  - Esercizi:
      - exercises/index.md
      - "1. Programmazione lineare intera": exercises/ilp.md
      - "2. Bound primali e bound duali": exercises/lp-relaxation.md
      - "3. Formulazioni ideali": exercises/ideal-formulations.md
      - "4. Disuguaglianze valide": exercises/valid-inequalities.md
      - "5. Disuguaglianze di copertura": exercises/cover.md
      - "6. Piani di taglio": exercises/gomory.md
      - "7. Branch-and-bound": exercises/bb.md
      - "8. Branch-and-cut": exercises/branch-and-cut.md
      - "9. Solver MIP": exercises/mip-solvers.md
      - "10. Euristiche MIP": exercises/mip-heuristics.md
  - Laboratorio: lab/index.md
  - Materiali scaricabili: downloads.md
  - Indice: indice.md
