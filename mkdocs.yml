# Modello del sito italiano di Programmazione lineare intera: genera_sito.py lo usa per scrivere mkdocs.yml
# (il menu delle parti al posto di NAV_PARTI, gli script del laboratorio al posto di GI_RICETTE).
# Non modificare mkdocs.yml a mano.
site_name: Programmazione lineare intera · Fabio Furini
site_description: >-
  Corso di programmazione lineare intera: modelli, formulazioni, metodi esatti, solver ed euristiche MIP,
  con spiegazioni, esempi svolti, esercizi e laboratorio interattivo.
site_author: Fabio Furini
site_url: https://fabiofurini.github.io/programmazione-lineare-intera/
repo_url: https://github.com/fabiofurini/programmazione-lineare-intera
copyright: >-
  &copy; 2026 Fabio Furini — testi e figure con licenza
  <a href="https://creativecommons.org/licenses/by/4.0/deed.it">CC BY 4.0</a>,
  codice con licenza
  <a href="https://github.com/fabiofurini/programmazione-lineare-intera/blob/main/LICENSE-CODE">MIT</a>

theme:
  name: material
  language: it
  icon:
    logo: material/dots-grid
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Tema scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Tema chiaro
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

# le pagine delle singole app non stanno nel menu: il laboratorio è una voce sola
not_in_nav: |
  /lab/*.md
  !/lab/index.md

plugins:
  - search:
      lang: it

extra:
  social:
    - icon: material/web
      link: https://fabiofurini.github.io/
      name: Fabio Furini — sito personale
    - icon: material/school
      link: https://www.diag.uniroma1.it/
      name: DIAG — Sapienza Università di Roma
    - icon: fontawesome/brands/github
      link: https://github.com/fabiofurini
      name: GitHub
    - icon: material/chart-timeline-variant
      link: https://fabiofurini.github.io/laboratorio-ricerca-operativa/
      name: Laboratorio di Ricerca Operativa
    - icon: material/vector-triangle
      link: https://fabiofurini.github.io/programmazione-lineare/
      name: Programmazione lineare
    - icon: material/vector-polygon
      link: https://fabiofurini.github.io/modellazione-mip/
      name: Modellazione MIP
    - icon: material/math-integral
      link: https://fabiofurini.github.io/analisi-matematica-1/
      name: Analisi Matematica 1
    - icon: material/matrix
      link: https://fabiofurini.github.io/algebra-lineare/
      name: Algebra lineare
    - icon: material/chart-bell-curve
      link: https://fabiofurini.github.io/ottimizzazione-convessa/
      name: Ottimizzazione convessa
    - icon: material/code-braces
      link: https://fabiofurini.github.io/algoritmi/
      name: Algoritmi
  alternate:
    - name: English
      link: https://fabiofurini.github.io/integer-linear-programming/
      lang: en

extra_css:
  - stylesheets/extra.css?v=1aa75eceb4
  - https://cdn.jsdelivr.net/npm/jsxgraph@1.10.1/distrib/jsxgraph.css
  - stylesheets/interattivi.css?v=5d53d6f224

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      title: On this page
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/cloudflare-analytics.js?v=bff73345a1
  - javascripts/mathjax.js?v=e9c4fa78ae
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js
  # grafici interattivi: JSXGraph, il motore, il catalogo dei problemi, poi le ricette (gi-*.js, le aggiunge genera_sito.py)
  - https://cdn.jsdelivr.net/npm/jsxgraph@1.10.1/distrib/jsxgraphcore.js
  - javascripts/interattivi.js?v=5452c77472
  - javascripts/gi-comune.js?v=40df75e3e5
  - javascripts/gi-pli-dati.js?v=8ebd23eab0
  - javascripts/gi-pli.js?v=26662f1816

nav:
  - Home: index.md
  - Bound:
      - modelli-e-bound/index.md
      - "1. La programmazione lineare intera": modelli-e-bound/ilp.md
      - "2. Bound primali e duali": modelli-e-bound/lp-relaxation.md
  - Formulazioni:
      - formulazioni/index.md
      - "3. Formulazioni ideali": formulazioni/ideal-formulations.md
      - "4. Disuguaglianze valide": formulazioni/valid-inequalities.md
      - "5. Disuguaglianze di cover": formulazioni/cover.md
  - Metodi esatti:
      - metodi-esatti/index.md
      - "6. Piani di taglio": metodi-esatti/gomory.md
      - "7. Branch-and-bound": metodi-esatti/bb.md
      - "8. Branch-and-cut": metodi-esatti/branch-and-cut.md
  - Solver:
      - solver/index.md
      - "9. Solver MIP": solver/mip-solvers.md
  - Euristiche:
      - euristiche-mip/index.md
      - "10. Euristiche MIP": euristiche-mip/mip-heuristics.md
  - Esercizi:
      - esercizi/index.md
      - "1. La programmazione lineare intera": esercizi/ilp.md
      - "2. Bound primali e duali": esercizi/lp-relaxation.md
      - "3. Formulazioni ideali": esercizi/ideal-formulations.md
      - "4. Disuguaglianze valide": esercizi/valid-inequalities.md
      - "5. Disuguaglianze di cover": esercizi/cover.md
      - "6. Piani di taglio": esercizi/gomory.md
      - "7. Branch-and-bound": esercizi/bb.md
      - "8. Branch-and-cut": esercizi/branch-and-cut.md
      - "9. Solver MIP": esercizi/mip-solvers.md
      - "10. Euristiche MIP": esercizi/mip-heuristics.md
  - Laboratorio: laboratorio/index.md
  - Materiale: materiale.md
  - Indice: indice.md
